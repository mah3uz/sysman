    <rect x="102" y="198" width="52" height="18" rx="9"/>
    <rect x="102" y="238" width="52" height="18" rx="9"/>
    <rect x="102" y="278" width="52" height="18" rx="9"/>
    <rect x="102" y="318" width="52" height="18" rx="9"/>
    <rect x="358" y="198" width="52" height="18" rx="9"/>
    <rect x="358" y="238" width="52" height="18" rx="9"/>
    <rect x="358" y="278" width="52" height="18" rx="9"/>
    <rect x="358" y="318" width="52" height="18" rx="9"/>
  </g>

  <!-- feet -->
  <g fill="url(#m-pin)">
    <rect x="190" y="366" width="46" height="44" rx="14"/>
    <rect x="276" y="366" width="46" height="44" rx="14"/>
  </g>

  <!-- body -->
