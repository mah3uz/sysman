  <rect x="136" y="150" width="240" height="236" rx="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M194 162 H318 C346 162 364 178 364 204 V214 C330 196 182 196 148 214 V204 C148 178 166 162 194 162 Z" fill="url(#m-sheen)"/>
