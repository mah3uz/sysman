    <rect width="1600" height="520" fill="url(#bg)"/>
    <ellipse cx="300" cy="270" rx="300" ry="260" fill="url(#glow-blue)"/>
    <ellipse cx="1340" cy="470" rx="420" ry="200" fill="url(#glow-green)"/>

