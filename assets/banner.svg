<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" font-family="Inter, 'Adwaita Sans', 'Segoe UI', system-ui, sans-serif">
  <title>sysman — a system monitor for Linux</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23252F"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#30D158" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cpu-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30D158" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="charts"><rect width="1600" height="520" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1600" height="520" rx="28"/></clipPath>
    
    <linearGradient id="m-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3140"/>
      <stop offset="1" stop-color="#16171C"/>
    </linearGradient>
    <linearGradient id="m-body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5BDCEF"/>
      <stop offset="0.55" stop-color="#2E9BF5"/>
      <stop offset="1" stop-color="#0A63E8"/>
    </linearGradient>
    <linearGradient id="m-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7C0CE"/>
      <stop offset="1" stop-color="#7C8596"/>
    </linearGradient>
    <linearGradient id="m-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30D158" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="m-led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE2A8"/>
      <stop offset="0.45" stop-color="#FF9F0A"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </radialGradient>
    <filter id="m-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="m-screen">
      <rect x="178" y="286" width="156" height="62" rx="18"/>
    </clipPath>
  
  </defs>

