    <g transform="translate(44 26)">
      <!-- shadow -->
  <ellipse cx="256" cy="420" rx="112" ry="14" fill="#000000" fill-opacity="0.45" filter="url(#m-soft)"/>

  <!-- antenna and live LED -->
  <line x1="256" y1="152" x2="256" y2="108" stroke="#9AA3B3" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="96" r="22" fill="#FF9F0A" fill-opacity="0.35" filter="url(#m-soft)"/>
  <circle cx="256" cy="96" r="14" fill="url(#m-led)"/>
  <circle cx="251" cy="91" r="4" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- pins as arms -->
