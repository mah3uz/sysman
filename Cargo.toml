[workspace]
resolver = "3"
members = ["crates/schema", "crates/sysman", "crates/sysman-helper", "crates/sysmand"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Mahfuz <mah3uz@gmail.com>"]
license = "MIT"

[workspace.dependencies]
schema = { path = "crates/schema", package = "sysman-schema" }
anyhow = "1"
jiff = "0.2"
# gpui-component pins gpui-pre exactly; any other version here would put two gpui copies in the graph.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
gpui-component = "=0.7.0"
gpui-kit-assets = "=0.7.0"
libc = "0.2"
nvml-wrapper = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
uuid = { version = "1", features = ["v5"] }

# gpui is too slow to use unoptimised.
[profile.dev.package."*"]
opt-level = 2
