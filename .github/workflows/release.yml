name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Tag matches the workspace version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$GITHUB_REF_NAME" in
            "v$ver" | "v$ver"-*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match version $ver" >&2; exit 1 ;;
          esac

      - name: Build in ubuntu:22.04
        run: dist/ci/run.sh build

      - name: Install tests in fresh containers
        run: dist/ci/run.sh test

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: target/release-assets/*/

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag --title "sysman ${GITHUB_REF_NAME#v}" \
            --generate-notes target/release-assets/*/*
